<svg xmlns="http://www.w3.org/2000/svg" width="640" height="747" viewBox="0 0 640 747" role="img" aria-labelledby="t d"><title id="t">PAYER CREDIT. An expense credits the payer and debits each participant’s share.; GREEDY SUGGESTIONS. Match debtors and creditors to produce a settlement list.; PAYMENT HISTORY. Recorded settlements adjust balances; no money transfer is executed.</title><desc id="d">PAYER CREDIT. An expense credits the payer and debits each participant’s share.; GREEDY SUGGESTIONS. Match debtors and creditors to produce a settlement list.; PAYMENT HISTORY. Recorded settlements adjust balances; no money transfer is executed. Conceptual expense-sharing illustration, not actual balances or customer data.</desc><style>@keyframes balance{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}.balance{animation:balance 8s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}@keyframes breathe{50%{r:13;opacity:.55}}.node{animation:breathe 6s ease-in-out infinite}@keyframes vector{50%{transform:rotate(-9deg)}}@keyframes float{50%{transform:translateY(-5px)}}.pulse{animation:pulse 5s ease-in-out infinite}.vector{animation:vector 12s ease-in-out infinite;transform-origin:0 0}.float{animation:float 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.balance,.node,.pulse,.vector,.float{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="592" height="230" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(46 34) scale(0.9090909090909091)"><path d="M5 6v33h34M5 39L33 12M5 39l34-13M26 12h7v7M32 24l7 2-3 7" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="104" y="63" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F3D962" font-weight="600" >PAYER CREDIT</text><text x="48" y="122" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >An expense credits the payer and debits</text><text x="48" y="156" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >each participant’s share.</text><rect x="24" y="257" width="592" height="230" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(46 279) scale(0.9090909090909091)"><path d="M4 13h34l-8-8M38 31H4l8 8" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="104" y="308" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F3D962" font-weight="600" >GREEDY SUGGESTIONS</text><text x="48" y="367" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >Match debtors and creditors to produce</text><text x="48" y="401" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >a settlement list.</text><rect x="24" y="502" width="592" height="230" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(46 524) scale(0.9090909090909091)"><path d="M5 6h14q4 0 4 4q0-4 4-4h14v31H27q-4 0-4 4q0-4-4-4H5zM23 10v31" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="104" y="553" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F3D962" font-weight="600" >PAYMENT HISTORY</text><text x="48" y="612" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >Recorded settlements adjust balances;</text><text x="48" y="646" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >no money transfer is executed.</text></svg>