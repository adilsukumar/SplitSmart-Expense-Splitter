<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="t d"><title id="t">SplitSmart. More shared stories. Less leftover math. Log it, split it, settle it.</title><desc id="d">SplitSmart. More shared stories. Less leftover math. Log it, split it, settle it. Conceptual expense-sharing illustration, not actual balances or customer data.</desc><style>@keyframes balance{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}.balance{animation:balance 8s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}@keyframes breathe{50%{r:13;opacity:.55}}.node{animation:breathe 6s ease-in-out infinite}@keyframes vector{50%{transform:rotate(-9deg)}}@keyframes float{50%{transform:translateY(-5px)}}.pulse{animation:pulse 5s ease-in-out infinite}.vector{animation:vector 12s ease-in-out infinite;transform-origin:0 0}.float{animation:float 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.balance,.node,.pulse,.vector,.float{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><text x="32" y="54" font-family="Bahnschrift, Arial, sans-serif" font-size="22" fill="#FF4081" font-weight="600" >SPLITSMART / ADIL SUKUMAR</text><text x="30" y="161" font-family="Bahnschrift, Arial, sans-serif" font-size="72" fill="#F8F8F3" font-weight="700" >More shared stories.</text><text x="30" y="238" font-family="Bahnschrift, Arial, sans-serif" font-size="75" fill="#BCFCF6" font-weight="700" >Less leftover math.</text><text x="32" y="312" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#A783F7" font-weight="400" >The trip ends. The friendships stay. Keep</text><text x="32" y="346" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#A783F7" font-weight="400" >the numbers easy to follow.</text><g transform="translate(790 365) scale(0.66)"><path d="M35 65L150 160L270 65M150 160V275" fill="none" stroke="#A783F7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><g class="balance" style="animation-delay:-0s"><rect x="0" y="0" width="80" height="70" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(22 9) scale(0.7727272727272727)"><path d="M15 5a7 7 0 1 0 0 14a7 7 0 1 0 0-14M30 8a6 6 0 1 1 0 12M3 40v-8c0-10 24-10 24 0v8M31 26c9 0 10 6 10 14" fill="none" stroke="#BCFCF6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="40" y="59" font-family="Bahnschrift, Arial, sans-serif" font-size="13" fill="#BCFCF6" font-weight="600" text-anchor="middle">PAID</text></g><g class="balance" style="animation-delay:-2s"><rect x="230" y="0" width="80" height="70" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(252 9) scale(0.7727272727272727)"><path d="M15 5a7 7 0 1 0 0 14a7 7 0 1 0 0-14M30 8a6 6 0 1 1 0 12M3 40v-8c0-10 24-10 24 0v8M31 26c9 0 10 6 10 14" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="270" y="59" font-family="Bahnschrift, Arial, sans-serif" font-size="13" fill="#FF4081" font-weight="600" text-anchor="middle">SHARE</text></g><g class="balance" style="animation-delay:-4s"><rect x="115" y="235" width="80" height="70" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(137 244) scale(0.7727272727272727)"><path d="M4 13h34l-8-8M38 31H4l8 8" fill="none" stroke="#F3D962" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="155" y="294" font-family="Bahnschrift, Arial, sans-serif" font-size="13" fill="#F3D962" font-weight="600" text-anchor="middle">SETTLE</text></g><rect x="105" y="112" width="90" height="90" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(128 127) scale(1.0)"><path d="M7 3h30v39l-5-4-5 4-5-4-5 4-5-4-5 4zM14 12h16M14 20h16M14 28h9" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="150" y="191" font-family="Bahnschrift, Arial, sans-serif" font-size="13" fill="#BCFCF6" font-weight="600" text-anchor="middle">ONE BILL</text></g><text x="32" y="648" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#F3D962" font-weight="600" >Log it. Split it. Settle it.</text></svg>