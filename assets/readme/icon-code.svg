<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-labelledby="t d"><title id="t">code</title><desc id="d">code Conceptual expense-sharing illustration, not actual balances or customer data.</desc><style>@keyframes balance{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}.balance{animation:balance 8s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}@keyframes breathe{50%{r:13;opacity:.55}}.node{animation:breathe 6s ease-in-out infinite}@keyframes vector{50%{transform:rotate(-9deg)}}@keyframes float{50%{transform:translateY(-5px)}}.pulse{animation:pulse 5s ease-in-out infinite}.vector{animation:vector 12s ease-in-out infinite;transform-origin:0 0}.float{animation:float 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.balance,.node,.pulse,.vector,.float{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><g transform="translate(2 2) scale(0.9545454545454546)"><path d="M14 10L3 22l11 12M30 10l11 12-11 12M26 5l-8 34" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g></svg>