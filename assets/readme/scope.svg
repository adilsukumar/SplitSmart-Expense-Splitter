<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="562" viewBox="0 0 1120 562" role="img" aria-labelledby="t d"><title id="t">NO SIGN-IN LAYER. Group links identify a group; this app has no member authentication.; CLIENT CONFIGURATION. The generated config includes keys readable by the browser.; LIVE TABLE EVENTS. Subscriptions refresh members, expenses and settlements for the group.</title><desc id="d">NO SIGN-IN LAYER. Group links identify a group; this app has no member authentication.; CLIENT CONFIGURATION. The generated config includes keys readable by the browser.; LIVE TABLE EVENTS. Subscriptions refresh members, expenses and settlements for the group. Conceptual expense-sharing illustration, not actual balances or customer data.</desc><style>@keyframes balance{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}.balance{animation:balance 8s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}@keyframes breathe{50%{r:13;opacity:.55}}.node{animation:breathe 6s ease-in-out infinite}@keyframes vector{50%{transform:rotate(-9deg)}}@keyframes float{50%{transform:translateY(-5px)}}.pulse{animation:pulse 5s ease-in-out infinite}.vector{animation:vector 12s ease-in-out infinite;transform-origin:0 0}.float{animation:float 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.balance,.node,.pulse,.vector,.float{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="522" height="260" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(46 34) scale(0.9090909090909091)"><path d="M4 7h36v27H4zM22 34v8M13 42h18" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="104" y="63" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F3D962" font-weight="600" >NO SIGN-IN LAYER</text><text x="48" y="122" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >Group links identify a group; this</text><text x="48" y="156" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >app has no member authentication.</text><rect x="574" y="12" width="522" height="260" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(596 34) scale(0.9090909090909091)"><path d="M14 10L3 22l11 12M30 10l11 12-11 12M26 5l-8 34" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="654" y="63" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F3D962" font-weight="600" >CLIENT CONFIGURATION</text><text x="598" y="122" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >The generated config includes keys</text><text x="598" y="156" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >readable by the browser.</text><rect x="24" y="287" width="522" height="260" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(46 309) scale(0.9090909090909091)"><path d="M3 5h12v12H3zM29 5h12v12H29zM16 29h12v12H16zM15 11h14M22 11v18" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="104" y="338" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F3D962" font-weight="600" >LIVE TABLE EVENTS</text><text x="48" y="397" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >Subscriptions refresh members,</text><text x="48" y="431" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >expenses and settlements for the</text><text x="48" y="465" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >group.</text></svg>